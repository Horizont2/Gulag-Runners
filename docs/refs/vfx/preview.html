<!doctype html>
<html><head><meta charset="utf-8"><title>hit</title>
<style>
  body { margin:0; background:#0d0f12; font:12px ui-monospace,monospace; color:#8d949c; }
  #strip { display:block; }
  .t { position:absolute; }
</style></head>
<body>
<canvas id="strip"></canvas>
<script>
// The same numbers that go into the Unity ParticleSystem. This file exists so the TIMING
// and the COLOUR RAMP can be looked at before any of it is authored blind.

const FRAMES = [0, 0.02, 0.045, 0.07, 0.11, 0.16, 0.22, 0.30];   // seconds
const CELL = 220;

const ACCENT = [255, 90, 66];     // UiPalette.Attack
const SPARK  = [255, 190, 84];
const RINGC  = [255, 217, 160];

// ---- the effect, as data. Each layer is one Unity ParticleSystem.
const SWING = -0.35;              // radians: the direction the blade was travelling

function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t,p){ return Math.pow(Math.min(1,Math.max(0,t)),p); }

// deterministic, so every screenshot of the same design is the same picture
let seed = 12345;
function rnd(){ seed = (seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }

function sparks(n){
  const out = [];
  for (let i=0;i<n;i++){
    const a = SWING + (rnd()-0.5)*1.05;
    out.push({ a, speed: lerp(10,15,rnd()), life: lerp(0.09,0.16,rnd()),
               size: lerp(0.5,1.0,rnd()) });
  }
  return out;
}
function bits(n){
  const out = [];
  for (let i=0;i<n;i++){
    out.push({ a: SWING + (rnd()-0.5)*1.8, speed: lerp(2.4,4.4,rnd()),
               life: lerp(0.16,0.26,rnd()), size: lerp(0.12,0.22,rnd()) });
  }
  return out;
}
const SPARKS = sparks(9);
const BITS = bits(4);

const tex = {};
function load(name){
  return new Promise(r => { const i = new Image(); i.onload = () => { tex[name]=i; r(); };
                            i.src = name + '.png'; });
}

function rgba(c, a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function blob(ctx, img, x, y, w, h, rot, colour, alpha){
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  // tint: draw the white texture then multiply a colour over it, keeping the alpha
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w)); c.height = Math.max(1,Math.ceil(h));
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, c.width, c.height);
  cx.globalCompositeOperation = 'source-in';
  cx.fillStyle = `rgb(${colour[0]},${colour[1]},${colour[2]})`;
  cx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(c, -w/2, -h/2, w, h);
  ctx.restore();
}

function frame(ctx, cx, cy, t, px){
  ctx.globalCompositeOperation = 'lighter';     // additive, as the Unity material will be

  // 1. THE SLASH -- one hard shape at contact. A stylised hit is a shape first.
  {
    const d = 0.075, k = t/d;
    if (k < 1){
      const s = lerp(1.05, 1.55, ease(k, 0.38)) * px * 0.95;
      const col = [lerp(255,ACCENT[0],ease(k,0.7)), lerp(255,ACCENT[1],ease(k,0.7)),
                   lerp(255,ACCENT[2],ease(k,0.7))];
      blob(ctx, tex.slash, cx, cy, s, s, SWING + Math.PI, col, Math.pow(1-k, 0.75));
    }
  }

  // 2. THE CORE -- the white-hot centre. Gone fastest of anything here.
  {
    const d = 0.07, k = t/d;
    if (k < 1){
      const s = lerp(0.35, 0.80, ease(k,0.5)) * px * 0.6;
      blob(ctx, tex.core, cx, cy, s, s, 0, [255,236,214], Math.pow(1-k, 1.5));
    }
  }

  // 3. THE RING -- says FORCE. Starts a beat late, so it reads as a consequence.
  {
    const delay = 0.012, d = 0.10, k = (t-delay)/d;
    if (k > 0 && k < 1){
      const s = lerp(0.20, 1.10, ease(k,0.5)) * px;
      blob(ctx, tex.ring, cx, cy, s, s, 0, RINGC, 0.55*Math.pow(1-k, 1.4));
    }
  }

  // 4. SPARKS -- few, chunky, decelerating, stretched along their own velocity.
  for (const s of SPARKS){
    const k = t/s.life;
    if (k >= 1) continue;
    // ease-out travel: fast out of the hit, then settling
    const dist = s.speed * s.life * ease(k, 0.42) * 0.42;
    const x = cx + Math.cos(s.a)*dist*px, y = cy + Math.sin(s.a)*dist*px;
    const speedNow = (1-ease(k,0.42));
    const len = (0.30 + 0.55*speedNow) * s.size * px;
    const wid = 0.10 * s.size * px * (1-k*0.6);
    const col = [lerp(SPARK[0],ACCENT[0],k), lerp(SPARK[1],ACCENT[1],k),
                 lerp(SPARK[2],ACCENT[2],k)];
    blob(ctx, tex.spark, x, y, len, wid, s.a, col, Math.pow(1-k, 0.7));
  }

  // 5. BITS -- the follow-through. Without these the effect looks cut off.
  for (const b of BITS){
    const k = t/b.life;
    if (k >= 1) continue;
    const dist = b.speed * b.life * ease(k,0.5) * 0.42;
    const fall = 7.0 * t * t;
    const x = cx + Math.cos(b.a)*dist*px, y = cy + Math.sin(b.a)*dist*px + fall*px;
    const s = b.size * px * (1 - k*0.4);
    blob(ctx, tex.spark, x, y, s*2.2, s*0.8, b.a, ACCENT, 0.85*Math.pow(1-k, 0.9));
  }

  ctx.globalCompositeOperation = 'source-over';
}

Promise.all(['core','spark','ring','slash'].map(load)).then(() => {
  const c = document.getElementById('strip');
  const n = FRAMES.length;
  c.width = CELL*n; c.height = CELL + 26;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#15181d';
  ctx.fillRect(0,0,c.width,c.height);

  FRAMES.forEach((t, i) => {
    const x0 = i*CELL;
    // a floor line and a body-coloured block, so the effect is judged against something
    ctx.fillStyle = '#1b1f26'; ctx.fillRect(x0+1, 1, CELL-2, CELL-2);
    ctx.fillStyle = '#2a3038'; ctx.fillRect(x0+CELL*0.36, CELL*0.30, CELL*0.28, CELL*0.56);
    frame(ctx, x0+CELL*0.40, CELL*0.50, t, CELL*0.42);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#6f7780'; ctx.font = '13px ui-monospace,monospace';
    ctx.fillText((t*1000).toFixed(0)+' ms', x0+8, CELL+18);
  });
  document.title = 'ready';
});
</script>
</body></html>
